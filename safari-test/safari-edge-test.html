<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba base (como alaramx.com)</title>
<style>
html,body{margin:0}body{background:#fff}
.hero{position:relative;height:100vh;overflow:hidden;display:flex;align-items:center}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .info{position:relative}
.more{padding:40px 24px;font:17px/1.5 -apple-system,system-ui,sans-serif;color:#333}
.info{font:500 13px/1.45 -apple-system,system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.62);border-radius:14px;padding:12px 14px;width:78%;margin:0 auto}
.info b{font-size:15px}.info code{font:12px ui-monospace,Menlo,monospace;color:#FFD60A}
</style>
</head>
<body>
<section class="hero"><img src="foto.jpg" alt=""><div class="info"><b>Prueba base (como alaramx.com)</b><br>Igual que alaramx.com: sin viewport-fit=cover, página normal que se desplaza.<br><span id="nums"></span></div></section>
<section class="more"><p>Contenido de la página (para poder desplazarse, igual que alaramx.com).</p><p style="height:1400px"></p><p>Fin.</p></section>
<script>
(function(){var p=document.createElement('div');p.style.cssText='position:absolute;left:0;top:0;width:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)';document.body.appendChild(p);
function u(){var el=document.getElementById('nums');if(!el)return;el.innerHTML='safe-area arriba: <code>'+parseFloat(getComputedStyle(p).paddingTop)+'</code><br>innerHeight: <code>'+innerHeight+'</code> · pantalla: <code>'+screen.height+'</code><br>scroll: <code>'+Math.round(scrollY)+'</code>';}
u();addEventListener('scroll',u,{passive:true});addEventListener('resize',u);setInterval(u,500);})();
</script>
</body>
</html>
